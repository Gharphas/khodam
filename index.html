<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Khodam Online</title>
</head>

<body>
    <div class="container">
        <h1>🔮 Cek Khodam Online</h1>
        <p>Masukkan nama lengkap dan tanggal lahir Anda untuk mengetahui khodam pendamping:</p>
        <form id="khodamForm">
            <label for="name">Nama Lengkap:</label>
            <input type="text" id="name" name="name" placeholder="Contoh: Budi Santoso" required>

            <label for="dob">Tanggal Lahir:</label>
            <input type="date" id="dob" name="dob" required>

            <button type="submit">✨ Cek Khodam Sekarang</button>
        </form>
        <div id="result"></div>
    </div>
</body>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #09cbf7 0%, #0056b3 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    
    .container {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 420px;
        width: 100%;
    }
    
    h1 {
        color: #1e293b;
        font-size: 1.5rem;
        margin-bottom: 10px;
    }

    p {
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 20px;
        line-height: 1.4;
    }
    
    form {
        display: flex;
        flex-direction: column;
        text-align: left;
    }
    
    label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
    }
    
    input {
        padding: 12px;
        border: 1.5px solid #cbd5e1;
        border-radius: 8px;
        width: 100%;
        margin-bottom: 15px;
        font-size: 0.95rem;
        transition: border-color 0.3s;
    }

    input:focus {
        border-color: #007BFF;
        outline: none;
    }
    
    button {
        margin-top: 10px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #007BFF 0%, #0056b3 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
    }
    
    #result {
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        color: #166534;
        font-size: 1.05rem;
        font-weight: bold;
        display: none;
        animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
<script>
    document.getElementById('khodamForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;

        const resultEl = document.getElementById('result');
        resultEl.style.display = 'block';
        resultEl.innerText = '🔮 Sedang menerawang khodam...';

        setTimeout(() => {
            const result = cekKhodam(name, dob);
            resultEl.innerHTML = `✨ Khodam Anda adalah:<br><span style="font-size: 1.25rem; color: #0284c7;">${result}</span>`;
        }, 600);
    });

    function cekKhodam(name, dob) {
        const khodamList = [
            'Khodam Banaspati Api',
            'Khodam Syech Sakti',
            'Khodam Naga Emas',
            'Khodam Macan Putih',
            'Khodam Bakso Granat',
            'Khodam Naga Hitam',
            'Khodam Nenek Kebayan',
            'Khodam Iwak Asin',
            'Khodam Susu Beruang',
            'Khodam Pascol Barbar',
            'Khodam Mobil Jenazah',
            'Khodam Kucing Oren',
            'Khodam Elang Perkasa',
            'Khodam Rawa Rontek'
        ];
        const index = (name.length + new Date(dob).getDate()) % khodamList.length;
        return khodamList[index];
    }
</script>

</html>
